<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>캠퍼스 과제 플래너</title>
    <meta
      name="description"
      content="한 학기 여러 과목의 과제와 마감을 D-day 순으로 자동 정렬해 관리하는 대학생용 과제·일정 관리 웹앱"
    />
    <meta property="og:title" content="캠퍼스 과제 플래너" />
    <meta
      property="og:description"
      content="한 학기 여러 과목의 과제와 마감을 D-day 순으로 자동 정렬해 관리하는 대학생용 과제·일정 관리 웹앱"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-canvas: #f7f8fa;
        --bg-surface: #ffffff;
        --bg-subtle: #f1f3f6;
        --bg-urgent: #fef2f2;
        --bg-completed: #f9fafb;

        --text-primary: #111827;
        --text-secondary: #4b5563;
        --text-muted: #6b7280;

        --border-default: #e5e7eb;
        --border-strong: #d1d5db;
        --border-urgent: #fecaca;

        --accent-primary: #1d4ed8;
        --accent-primary-hover: #1e40af;
        --accent-soft: #eff6ff;

        --urgent-red: #dc2626;
        --urgent-red-dark: #b91c1c;
        --warning-amber: #b45309;

        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 22px;

        --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.04);
        --shadow-sheet: 0 -8px 30px rgba(17, 24, 39, 0.14);

        --font-sans: "Plus Jakarta Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", "Plus Jakarta Sans", monospace;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-sans);
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
      }

      :focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Top Header (3-zone contract, <=56px height on mobile) */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-default);
      }

      .topbar-inner {
        max-width: 1180px;
        margin: 0 auto;
        height: 56px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }

      .brand {
        font-size: 1.0625rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        white-space: nowrap;
        flex-shrink: 0;
        text-decoration: none;
      }

      .topbar-nav {
        display: none;
        align-items: center;
        gap: 24px;
      }

      .topbar-nav-link {
        background: none;
        border: none;
        padding: 6px 2px;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap;
        flex-shrink: 0;
        border-bottom: 2px solid transparent;
        transition: color 160ms var(--ease-out), border-color 160ms var(--ease-out);
      }

      .topbar-nav-link:hover {
        color: var(--text-primary);
      }

      .topbar-nav-link.is-active {
        color: var(--text-primary);
        font-weight: 600;
        border-bottom-color: var(--accent-primary);
      }

      .topbar-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 40px;
        padding: 8px 16px;
        border: none;
        border-radius: var(--radius-sm);
        background-color: var(--accent-primary);
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 160ms var(--ease-out), transform 140ms var(--ease-out);
      }

      .topbar-cta:hover {
        background-color: var(--accent-primary-hover);
      }

      .topbar-cta:active {
        transform: scale(0.98);
      }

      /* Main Layout */
      .workspace {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px 16px 88px;
      }

      .workspace-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }

      /* Page Intro & Summary Strip */
      .page-header {
        margin-bottom: 20px;
      }

      .page-title {
        margin: 0 0 4px;
        font-size: clamp(1.375rem, 2.4vw, 1.875rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.25;
        text-wrap: balance;
      }

      .page-subtitle {
        margin: 0;
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      /* Unboxed hairline metric strip */
      .summary-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        margin-bottom: 20px;
        overflow: hidden;
      }

      .summary-cell {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .summary-cell + .summary-cell {
        border-left: 1px solid var(--border-default);
      }

      .summary-label {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .summary-value {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 1.375rem;
        font-weight: 700;
        line-height: 1.2;
        color: var(--text-primary);
      }

      .summary-value.is-urgent {
        color: var(--urgent-red);
      }

      /* Desktop Form Panel / Mobile Bottom Sheet */
      .composer-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(17, 24, 39, 0.45);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        opacity: 0;
        transition: opacity 180ms var(--ease-out);
      }

      .composer-backdrop.is-open {
        display: block;
        opacity: 1;
      }

      .composer-panel {
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow-sm);
      }

      .sheet-handle {
        display: none;
        width: 40px;
        height: 4px;
        border-radius: 999px;
        background: var(--border-strong);
        margin: 0 auto 14px;
      }

      .composer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .composer-title {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      .sheet-close-btn {
        display: none;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        margin: -8px -8px -8px 0;
        background: none;
        border: none;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
      }

      .sheet-close-btn:hover {
        background: var(--bg-subtle);
        color: var(--text-primary);
      }

      /* Form Controls */
      .task-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .field-input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        font-size: 0.9375rem;
        color: var(--text-primary);
        transition: border-color 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
      }

      .field-input::placeholder {
        color: #9ca3af;
      }

      .field-input:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
      }

      .quick-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 2px;
      }

      .quick-btn {
        min-height: 32px;
        padding: 4px 10px;
        border: 1px solid var(--border-default);
        border-radius: 6px;
        background: var(--bg-subtle);
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap;
        transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out), border-color 140ms var(--ease-out);
      }

      .quick-btn:hover {
        background: #e5e7eb;
        color: var(--text-primary);
      }

      .priority-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 4px;
        background: var(--bg-subtle);
        border-radius: var(--radius-sm);
      }

      .priority-btn {
        min-height: 40px;
        padding: 8px 10px;
        border: none;
        border-radius: 6px;
        background: transparent;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
      }

      .priority-btn:hover {
        color: var(--text-primary);
      }

      .priority-btn[aria-pressed="true"] {
        background: var(--bg-surface);
        color: var(--text-primary);
        box-shadow: 0 1px 2px rgba(17, 24, 39, 0.08);
      }

      .priority-btn[data-priority="high"][aria-pressed="true"] {
        color: var(--urgent-red);
      }

      .form-error {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--urgent-red);
        min-height: 1.2em;
      }

      .form-actions {
        display: flex;
        gap: 8px;
        margin-top: 2px;
      }

      .btn-primary {
        flex: 1;
        min-height: 46px;
        padding: 10px 18px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent-primary);
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 600;
        white-space: nowrap;
        transition: background-color 150ms var(--ease-out), transform 140ms var(--ease-out);
      }

      .btn-primary:hover {
        background: var(--accent-primary-hover);
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .btn-secondary {
        min-height: 46px;
        padding: 10px 16px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        color: var(--text-secondary);
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .btn-secondary:hover {
        background: var(--bg-subtle);
        color: var(--text-primary);
      }

      /* Filter Toolbar */
      .toolbar {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 16px;
      }

      .toolbar-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .segmented-tabs {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--bg-subtle);
        border-radius: var(--radius-sm);
      }

      .seg-tab {
        min-height: 36px;
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        background: transparent;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
        transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
      }

      .seg-tab:hover {
        color: var(--text-primary);
      }

      .seg-tab[aria-selected="true"] {
        background: var(--bg-surface);
        color: var(--text-primary);
        box-shadow: 0 1px 2px rgba(17, 24, 39, 0.08);
      }

      .toolbar-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .sort-caption {
        font-size: 0.75rem;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .reset-btn {
        min-height: 36px;
        padding: 6px 12px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        color: var(--text-secondary);
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out);
      }

      .reset-btn:hover {
        background: var(--bg-subtle);
        border-color: var(--border-strong);
        color: var(--text-primary);
      }

      .reset-btn:active {
        transform: scale(0.98);
      }

      .course-filter-row {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .course-filter-row::-webkit-scrollbar {
        display: none;
      }

      .course-tab {
        min-height: 36px;
        padding: 6px 12px;
        border: 1px solid var(--border-default);
        border-bottom: 2px solid var(--course-color, var(--border-default));
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--course-color, var(--text-secondary));
        white-space: nowrap;
        flex-shrink: 0;
        transition: border-color 140ms var(--ease-out), background-color 140ms var(--ease-out), color 140ms var(--ease-out);
      }

      .course-tab:hover {
        border-color: var(--course-color, var(--border-strong));
        background: var(--course-bg, var(--bg-subtle));
      }

      .course-tab[aria-pressed="true"] {
        background: var(--course-color, var(--text-primary));
        border-color: var(--course-color, var(--text-primary));
        color: #ffffff;
        font-weight: 600;
      }

      /* Weekly Calendar View */
      .weekly-section {
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        margin-bottom: 20px;
        overflow: hidden;
      }

      .weekly-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-default);
        flex-wrap: wrap;
      }

      .weekly-title-group {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .weekly-title {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .weekly-range {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .weekly-nav {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .week-nav-btn {
        min-height: 36px;
        min-width: 36px;
        padding: 6px 10px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
      }

      .week-nav-btn:hover {
        background: var(--bg-subtle);
        color: var(--text-primary);
      }

      .weekly-grid {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(150px, 1fr);
        overflow-x: auto;
        scroll-snap-type: x proximity;
        scrollbar-width: thin;
      }

      .week-day-col {
        min-height: 142px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-right: 1px solid var(--border-default);
        scroll-snap-align: start;
      }

      .week-day-col:last-child {
        border-right: none;
      }

      .week-day-col.is-today {
        background: #f8faff;
      }

      .week-day-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(17, 24, 39, 0.06);
      }

      .week-day-name {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-secondary);
      }

      .week-day-col.is-today .week-day-name {
        color: var(--accent-primary);
      }

      .week-day-num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .week-day-col.is-today .week-day-num {
        color: var(--accent-primary);
        font-weight: 700;
      }

      .week-day-items {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .week-day-empty {
        margin: 8px 0 0;
        font-size: 0.75rem;
        color: #9ca3af;
      }

      .cal-item {
        width: 100%;
        min-height: 44px;
        padding: 7px 8px;
        border: 1px solid var(--course-border, var(--border-default));
        border-radius: 8px;
        background: var(--course-bg, var(--bg-subtle));
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 2px;
        transition: transform 140ms var(--ease-out), border-color 140ms var(--ease-out), opacity 140ms var(--ease-out);
      }

      .cal-item:hover {
        border-color: var(--course-color, var(--border-strong));
      }

      .cal-item:active {
        transform: scale(0.98);
      }

      .cal-item.is-urgent {
        background: var(--bg-urgent);
        border-color: var(--border-urgent);
      }

      .cal-item.is-completed {
        opacity: 0.48;
      }

      .cal-item-course {
        font-size: 0.6875rem;
        font-weight: 700;
        color: var(--course-color, var(--text-primary));
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cal-item-title {
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.3;
        color: var(--text-primary);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .cal-item.is-completed .cal-item-title {
        text-decoration: line-through;
        color: var(--text-secondary);
      }

      .cal-item-flag {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.6875rem;
        font-weight: 700;
        color: var(--urgent-red);
      }

      /* Card Grid */
      .cards-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      /* Assignment Card (single-elevation, zero-pill metadata, NO thick left accent border) */
      .task-card {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        transition: opacity 180ms var(--ease-out), background-color 180ms var(--ease-out), border-color 180ms var(--ease-out), transform 180ms var(--ease-out);
      }

      .task-card:hover {
        border-color: var(--border-strong);
      }

      .task-card.is-urgent {
        background: var(--bg-urgent);
        border-color: var(--border-urgent);
      }

      .task-card.is-urgent:hover {
        border-color: #fca5a5;
      }

      .task-card.is-completed {
        background: var(--bg-completed);
        border-color: var(--border-default);
        opacity: 0.52;
      }

      .task-card.is-completed:hover {
        opacity: 0.72;
      }

      /* 44x44px Accessible Check Button */
      .check-btn {
        position: relative;
        width: 44px;
        height: 44px;
        margin: -8px 0 -8px -8px;
        padding: 0;
        border: none;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border-radius: var(--radius-sm);
      }

      .check-box {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1.75px solid var(--border-strong);
        background: var(--bg-surface);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out);
      }

      .check-btn:hover .check-box {
        border-color: var(--accent-primary);
      }

      .task-card.is-urgent .check-box {
        border-color: #f87171;
      }

      .task-card.is-completed .check-box {
        background: var(--text-secondary);
        border-color: var(--text-secondary);
        color: #ffffff;
      }

      .check-icon {
        width: 14px;
        height: 14px;
        opacity: 0;
        transform: scale(0.8);
        transition: opacity 140ms var(--ease-out), transform 140ms var(--ease-out);
      }

      .task-card.is-completed .check-icon {
        opacity: 1;
        transform: scale(1);
      }

      /* Card Content */
      .card-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .card-text-col {
        min-width: 0;
        flex: 1;
      }

      /* Unboxed typographic metadata kicker */
      .card-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }

      .meta-course {
        font-weight: 700;
        color: var(--course-color, var(--text-primary));
        border-bottom: 2px solid var(--course-border, transparent);
        padding-bottom: 1px;
      }

      .meta-sep {
        color: #9ca3af;
      }

      .meta-priority-high {
        color: var(--urgent-red-dark);
        font-weight: 700;
      }

      .meta-priority-mid {
        color: var(--text-secondary);
        font-weight: 600;
      }

      .meta-priority-low {
        color: var(--text-muted);
      }

      .card-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.4;
        color: var(--text-primary);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .task-card.is-completed .card-title {
        text-decoration: line-through;
        color: var(--text-secondary);
      }

      /* D-day Readout */
      .dday-col {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        flex-shrink: 0;
        text-align: right;
      }

      .dday-value {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 1.125rem;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }

      .task-card.is-urgent .dday-value {
        color: var(--urgent-red);
      }

      .task-card.is-completed .dday-value {
        color: var(--text-muted);
        font-size: 0.875rem;
        font-family: var(--font-sans);
      }

      .dday-caption {
        font-size: 0.6875rem;
        font-weight: 600;
        margin-top: 2px;
        color: var(--text-muted);
      }

      .task-card.is-urgent .dday-caption {
        color: var(--urgent-red-dark);
      }

      .task-card.is-soon .dday-caption {
        color: var(--warning-amber);
      }

      /* Card Footer */
      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 4px;
        padding-top: 8px;
        border-top: 1px solid rgba(17, 24, 39, 0.06);
      }

      .due-date-text {
        font-size: 0.8125rem;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }

      .task-card.is-urgent .due-date-text {
        color: var(--urgent-red-dark);
        font-weight: 500;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 2px;
        margin: -6px -8px -6px 0;
      }

      .icon-btn {
        min-width: 40px;
        min-height: 40px;
        padding: 8px;
        border: none;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
      }

      .icon-btn:hover {
        background: rgba(17, 24, 39, 0.06);
        color: var(--text-primary);
      }

      .icon-btn.is-delete:hover {
        background: #fee2e2;
        color: var(--urgent-red);
      }

      /* Empty State */
      .empty-state {
        padding: 48px 20px;
        text-align: center;
        background: var(--bg-surface);
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-md);
      }

      .empty-title {
        margin: 0 0 6px;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .empty-desc {
        margin: 0 0 18px;
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      .empty-actions {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      /* Undo Toast */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 60;
        transform: translate(-50%, 16px);
        opacity: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 14px 10px 16px;
        background: #111827;
        color: #ffffff;
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        box-shadow: 0 10px 25px rgba(17, 24, 39, 0.25);
        transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
      }

      .toast.is-visible {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, 0);
      }

      .toast-undo {
        min-height: 32px;
        padding: 4px 10px;
        border: none;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.16);
        color: #ffffff;
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .toast-undo:hover {
        background: rgba(255, 255, 255, 0.26);
      }

      /* Delete Confirmation Dialog */
      .dialog-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 70;
        padding: 16px;
        background: rgba(17, 24, 39, 0.5);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        align-items: center;
        justify-content: center;
      }

      .dialog-backdrop.is-open {
        display: flex;
      }

      .dialog-panel {
        width: 100%;
        max-width: 380px;
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: 0 20px 40px rgba(17, 24, 39, 0.18);
      }

      .dialog-title {
        margin: 0 0 8px;
        font-size: 1.0625rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .dialog-desc {
        margin: 0 0 18px;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--text-secondary);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .btn-danger {
        min-height: 44px;
        padding: 10px 16px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--urgent-red);
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
        transition: background-color 140ms var(--ease-out);
      }

      .btn-danger:hover {
        background: var(--urgent-red-dark);
      }

      /* Syllabus Import Button & Modal */
      .composer-import-row {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border-default);
      }

      .import-trigger-btn {
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--bg-subtle);
        color: var(--text-primary);
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out);
      }

      .import-trigger-btn:hover {
        background: #e5e7eb;
        border-color: #9ca3af;
      }

      .toolbar-import-btn {
        min-height: 36px;
        padding: 6px 12px;
        border: 1px solid var(--accent-primary);
        border-radius: var(--radius-sm);
        background: var(--accent-soft);
        color: var(--accent-primary);
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
      }

      .toolbar-import-btn:hover {
        background: var(--accent-primary);
        color: #ffffff;
      }

      .syllabus-panel {
        width: 100%;
        max-width: 640px;
        max-height: 90dvh;
        overflow-y: auto;
        background: var(--bg-surface);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-lg);
        padding: 22px;
        box-shadow: 0 24px 48px rgba(17, 24, 39, 0.22);
      }

      .syllabus-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .syllabus-subtitle {
        margin: 4px 0 0;
        font-size: 0.8125rem;
        color: var(--text-secondary);
      }

      .syllabus-close-btn {
        min-width: 44px;
        min-height: 44px;
        margin: -8px -8px 0 0;
        border: none;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .syllabus-close-btn:hover {
        background: var(--bg-subtle);
        color: var(--text-primary);
      }

      .syllabus-dropzone {
        border: 1.5px dashed var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--bg-subtle);
        padding: 14px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        transition: border-color 150ms var(--ease-out), background-color 150ms var(--ease-out);
      }

      .syllabus-dropzone.is-dragover {
        border-color: var(--accent-primary);
        background: var(--accent-soft);
      }

      .dropzone-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }

      .dropzone-title {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .dropzone-desc {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .dropzone-btn {
        min-height: 40px;
        padding: 8px 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        color: var(--text-primary);
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .dropzone-btn:hover {
        background: #e5e7eb;
      }

      .attached-file-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        background: var(--accent-soft);
      }

      .attached-file-bar[hidden] {
        display: none;
      }

      .attached-file-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 0.8125rem;
        color: var(--text-primary);
      }

      .attached-file-type {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent-primary);
        flex-shrink: 0;
      }

      .attached-file-name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .attached-file-size {
        font-size: 0.75rem;
        color: var(--text-muted);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .attached-remove-btn {
        min-height: 36px;
        padding: 6px 10px;
        border: 1px solid var(--border-default);
        border-radius: 6px;
        background: var(--bg-surface);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .attached-remove-btn:hover {
        background: #fee2e2;
        border-color: #fecaca;
        color: var(--urgent-red);
      }

      .syllabus-textarea {
        width: 100%;
        min-height: 150px;
        padding: 12px 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        font: inherit;
        font-size: 0.9375rem;
        line-height: 1.55;
        color: var(--text-primary);
        resize: vertical;
        transition: border-color 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
      }

      .syllabus-textarea:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
      }

      .syllabus-hint {
        margin: 6px 0 12px;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .syllabus-analyze-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .syllabus-status {
        margin: 12px 0 0;
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .syllabus-status.is-error {
        color: var(--urgent-red);
      }

      .preview-section {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border-default);
      }

      .preview-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .preview-title {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .preview-count {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--accent-primary);
      }

      .preview-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 280px;
        overflow-y: auto;
        padding-right: 2px;
      }

      .preview-item {
        padding: 12px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        background: var(--bg-subtle);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .preview-row-top {
        display: grid;
        grid-template-columns: 1fr 1.6fr;
        gap: 8px;
      }

      .preview-row-bottom {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .preview-input,
      .preview-select {
        min-height: 38px;
        padding: 6px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--bg-surface);
        font-size: 0.8125rem;
        color: var(--text-primary);
      }

      .preview-date {
        font-variant-numeric: tabular-nums;
      }

      .preview-remove-btn {
        margin-left: auto;
        min-height: 38px;
        padding: 6px 10px;
        border: 1px solid var(--border-default);
        border-radius: 6px;
        background: var(--bg-surface);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .preview-remove-btn:hover {
        background: #fee2e2;
        border-color: #fecaca;
        color: var(--urgent-red);
      }

      .preview-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }

      @media (max-width: 600px) {
        .preview-row-top {
          grid-template-columns: 1fr;
        }
      }

      /* Mobile Bottom Sheet Behavior (< 960px) */
      @media (max-width: 959px) {
        .composer-panel {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 50;
          max-height: 88dvh;
          overflow-y: auto;
          border-radius: var(--radius-xl) var(--radius-xl) 0 0;
          border-bottom: none;
          box-shadow: var(--shadow-sheet);
          padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
          transform: translateY(105%);
          transition: transform 220ms var(--ease-out);
        }

        .composer-panel.is-open {
          transform: translateY(0);
        }

        .sheet-handle {
          display: block;
        }

        .sheet-close-btn {
          display: inline-flex;
        }

        .icon-btn {
          min-width: 44px;
          min-height: 44px;
        }
      }

      /* Desktop Layout (>= 960px) */
      @media (min-width: 960px) {
        .topbar-inner {
          padding: 0 24px;
        }

        .topbar-nav {
          display: flex;
        }

        .workspace {
          padding: 28px 24px 56px;
        }

        .workspace-grid {
          grid-template-columns: 360px 1fr;
          gap: 28px;
        }

        .composer-panel {
          position: sticky;
          top: 80px;
        }

        .cards-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }

        .weekly-grid {
          grid-auto-flow: initial;
          grid-template-columns: repeat(7, minmax(0, 1fr));
          overflow-x: visible;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="#top" class="brand">캠퍼스 과제 플래너</a>

        <nav class="topbar-nav" aria-label="상태 바로가기">
          <button type="button" class="topbar-nav-link" data-nav-filter="week">이번주</button>
          <button type="button" class="topbar-nav-link is-active" data-nav-filter="all">전체</button>
          <button type="button" class="topbar-nav-link" data-nav-filter="completed">완료</button>
        </nav>

        <button type="button" id="openComposerBtn" class="topbar-cta">+ 과제 추가</button>
      </div>
    </header>

    <main id="top" class="workspace">
      <div class="workspace-grid">
        <!-- Left Column (Desktop) / Bottom Sheet (Mobile): Input Form -->
        <div>
          <div id="composerBackdrop" class="composer-backdrop" aria-hidden="true"></div>
          <section
            id="composerPanel"
            class="composer-panel"
            aria-labelledby="composerTitle"
          >
            <div class="sheet-handle" aria-hidden="true"></div>
            <div class="composer-header">
              <h2 id="composerTitle" class="composer-title">새 과제 등록</h2>
              <button
                type="button"
                id="closeSheetBtn"
                class="sheet-close-btn"
                aria-label="입력 창 닫기"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 6 6 18" />
                  <path d="m6 6 12 12" />
                </svg>
              </button>
            </div>

            <form id="taskForm" class="task-form" novalidate>
              <div class="field">
                <label class="field-label" for="courseInput">과목명</label>
                <input
                  id="courseInput"
                  name="course"
                  type="text"
                  class="field-input"
                  placeholder="예: 자료구조, 마케팅원론"
                  maxlength="40"
                  autocomplete="off"
                  required
                />
                <div id="courseQuickPicks" class="quick-row" aria-label="최근 입력 과목"></div>
              </div>

              <div class="field">
                <label class="field-label" for="titleInput">과제명</label>
                <input
                  id="titleInput"
                  name="title"
                  type="text"
                  class="field-input"
                  placeholder="예: 3주차 알고리즘 문제풀이 제출"
                  maxlength="80"
                  autocomplete="off"
                  required
                />
              </div>

              <div class="field">
                <label class="field-label" for="dueDateInput">마감일</label>
                <input
                  id="dueDateInput"
                  name="dueDate"
                  type="date"
                  class="field-input"
                  required
                />
                <div class="quick-row" aria-label="마감일 빠른 선택">
                  <button type="button" class="quick-btn" data-date-offset="0">오늘</button>
                  <button type="button" class="quick-btn" data-date-offset="1">내일</button>
                  <button type="button" class="quick-btn" data-date-offset="3">3일 뒤</button>

        // Date Helpers (local calendar day without UTC drift)
        function formatDateISO(date) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, "0");
          const d = String(date.getDate()).padStart(2, "0");
          return `${y}-${m}-${d}`;
        }

        function getOffsetDateISO(offsetDays) {
          const d = new Date();
          d.setDate(d.getDate() + offsetDays);
          return formatDateISO(d);
        }

        function getDayDiff(dueDateStr) {
          const parts = dueDateStr.split("-").map(Number);
          if (parts.length !== 3 || parts.some(Number.isNaN)) return 0;
          const due = new Date(parts[0], parts[1] - 1, parts[2]);
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          return Math.round((due.getTime() - today.getTime()) / 86400000);
        }

        function formatDisplayDate(dueDateStr) {
          const parts = dueDateStr.split("-").map(Number);
          if (parts.length !== 3 || parts.some(Number.isNaN)) return dueDateStr;
          const date = new Date(parts[0], parts[1] - 1, parts[2]);
          const month = date.getMonth() + 1;
          const day = date.getDate();
          const weekday = WEEKDAYS[date.getDay()];
          return `${month}월 ${day}일 (${weekday})`;
        }

        function getWeekDays(offsetWeeks) {
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const todayISO = formatDateISO(today);
          // Monday-based week (Mon = 0 ... Sun = 6)
          const dayOfWeek = (today.getDay() + 6) % 7;
          const monday = new Date(today);
          monday.setDate(today.getDate() - dayOfWeek + offsetWeeks * 7);

          const days = [];
          for (let i = 0; i < 7; i++) {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            const iso = formatDateISO(d);
            days.push({
              iso,
              month: d.getMonth() + 1,
              day: d.getDate(),
              weekday: WEEKDAYS[d.getDay()],
              isToday: iso === todayISO,
            });
          }
          return days;
        }

        function isInCurrentWeek(dueDateStr) {
          const days = getWeekDays(0);
          return dueDateStr >= days[0].iso && dueDateStr <= days[6].iso;
        }

        function hashCourseName(name) {
          let hash = 0;
          for (let i = 0; i < name.length; i++) {
            hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
          }
          return hash;
        }

        function rebuildCourseColors() {
          courseColorMap = new Map();
          const usedIndices = new Set();
          const uniqueCourses = getUniqueCourses();

          uniqueCourses.forEach((courseName) => {
            const startIdx = hashCourseName(courseName) % COURSE_PALETTE.length;
            let chosenIdx = startIdx;
            if (usedIndices.size < COURSE_PALETTE.length) {
              while (usedIndices.has(chosenIdx)) {
                chosenIdx = (chosenIdx + 1) % COURSE_PALETTE.length;
              }
              usedIndices.add(chosenIdx);
            }
            courseColorMap.set(courseName, COURSE_PALETTE[chosenIdx]);
          });
        }

        function getCourseColor(courseName) {
          const key = courseName.trim();
          if (courseColorMap.has(key)) {
            return courseColorMap.get(key);
          }
          return COURSE_PALETTE[hashCourseName(key) % COURSE_PALETTE.length];
        }

        function getDdayMeta(diff, completed) {
          if (completed) {
            return { label: "완료됨", caption: "제출 완료", isUrgent: false, isSoon: false };
          }
          if (diff < 0) {
            return {
              label: `D+${Math.abs(diff)}`,
              caption: "마감 지남",
              isUrgent: true,
              isSoon: false,
            };
          }
          if (diff === 0) {
            return { label: "D-Day", caption: "오늘 마감", isUrgent: true, isSoon: false };
          }
          if (diff <= 3) {
            return { label: `D-${diff}`, caption: "마감 임박", isUrgent: true, isSoon: false };
          }
          if (diff <= 7) {
            return { label: `D-${diff}`, caption: "이번 주", isUrgent: false, isSoon: true };
          }
          return { label: `D-${diff}`, caption: "여유", isUrgent: false, isSoon: false };
        }

        function createId() {
          if (window.crypto && typeof window.crypto.randomUUID === "function") {
            return window.crypto.randomUUID();
          }
          return "task_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
        }

        // Storage
        function saveTasks() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          } catch (err) {
            // Storage quota exceeded or restricted mode
          }
        }

        function createStarterTasks() {
          const now = Date.now();
          return [
            {
              id: createId(),
              course: "자료구조",
              title: "이진 탐색 트리 및 AVL 회전 구현 레포트",

              priority: "high",
              completed: false,
              createdAt: now - 5000,
            },
            {
              id: createId(),
              course: "마케팅원론",
              title: "팀 프로젝트 브랜드 포지셔닝 발표자료 초안",
              dueDate: getOffsetDateISO(3),
              priority: "medium",
              completed: false,
              createdAt: now - 4000,
            },
            {
              id: createId(),
              course: "운영체제",
              title: "프로세스 스케줄링 시뮬레이터 소스코드 제출",
              dueDate: getOffsetDateISO(6),
              priority: "high",
              completed: false,
              createdAt: now - 3000,
            },
            {
              id: createId(),
              course: "선형대수학",
              title: "고유값과 고유벡터 연습문제 4장 풀이",
              dueDate: getOffsetDateISO(0),
              priority: "high",
              completed: false,
              createdAt: now - 2000,
            },
            {
              id: createId(),
              course: "대학영어회화",
              title: "Week 11 온라인 리스닝 퀴즈 완료하기",
              dueDate: getOffsetDateISO(2),
              priority: "low",
              completed: true,
              createdAt: now - 1000,
            },
          ];
        }

        function resetToStarterTasks() {
          const previousTasks = tasks.map((t) => ({ ...t }));
          tasks = createStarterTasks();
          statusFilter = "all";
          courseFilter = "all";
          weekOffset = 0;
          resetForm();
          saveTasks();
          render();
          showToast("예시 데이터로 초기화했습니다.", () => {
            tasks = previousTasks;
            saveTasks();
            render();
          });
        }

        function loadTasks() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw === null) {
              tasks = createStarterTasks();
              saveTasks();
              return;
            }
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              tasks = parsed.filter(
                (item) =>
                  item &&
                  typeof item.id === "string" &&
                  typeof item.course === "string" &&
                  typeof item.title === "string" &&
                  typeof item.dueDate === "string"
              );
            }
          } catch (err) {
            tasks = [];
          }
        }

        // Sorting: Incomplete first -> Due date closest -> Priority (high > medium > low) -> CreatedAt
        function sortTasks(list) {
          return list.slice().sort((a, b) => {
            if (a.completed !== b.completed) {
              return a.completed ? 1 : -1;
            }
            if (a.dueDate !== b.dueDate) {
              return a.dueDate.localeCompare(b.dueDate);
            }
            const priDiff = (PRIORITY_WEIGHT[b.priority] || 2) - (PRIORITY_WEIGHT[a.priority] || 2);
            if (priDiff !== 0) return priDiff;
            return (a.createdAt || 0) - (b.createdAt || 0);
          });
        }

        // Sheet / Form Controls
        function isMobileViewport() {
          return window.matchMedia("(max-width: 959px)").matches;
        }

        function openSheet() {
          if (isMobileViewport()) {
            composerBackdrop.classList.add("is-open");
            composerPanel.classList.add("is-open");

            setTimeout(() => courseInput.focus(), 180);
          } else {
            composerPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
            courseInput.focus();
          }
        }

        function closeSheet() {
          composerBackdrop.classList.remove("is-open");
          composerPanel.classList.remove("is-open");
          composerBackdrop.setAttribute("aria-hidden", "true");
        }

        function setPriority(priority) {
          selectedPriority = priority;
          priorityBtns.forEach((btn) => {
            btn.setAttribute("aria-pressed", String(btn.dataset.priority === priority));
          });

        function resetForm() {
          editingId = null;
          taskForm.reset();
          dueDateInput.value = getOffsetDateISO(1);

        function startEdit(task) {
          editingId = task.id;
          courseInput.value = task.course;

          dueDateInput.value = task.dueDate;
          setPriority(task.priority || "medium");
          formError.textContent = "";

        // Toast Undo
        function showToast(message, onUndo) {
          undoAction = typeof onUndo === "function" ? onUndo : null;
          toastText.textContent = message;
          toastUndoBtn.hidden = !undoAction;
          toast.classList.add("is-visible");
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("is-visible");
            undoAction = null;
          }, 4500);
        }

        // Rendering
        function getUniqueCourses() {
          const seen = new Set();
          tasks.forEach((t) => {
            const name = t.course.trim();
            if (name) seen.add(name);
          });
          return Array.from(seen);
        }

        function renderQuickPicks() {
          const courses = getUniqueCourses();
          courseQuickPicks.textContent = "";

        function renderWeeklyCalendar() {
          const days = getWeekDays(weekOffset);
          const first = days[0];
          const last = days[6];
          weeklyRangeLabel.textContent = `${first.month}.${first.day} (${first.weekday}) – ${last.month}.${last.day} (${last.weekday})`;
          currentWeekBtn.textContent = weekOffset === 0 ? "이번주" : "이번주로";

          weeklyGrid.textContent = "";
          const sorted = sortTasks(tasks);

          let todayColEl = null;

          days.forEach((dayInfo) => {
            const col = document.createElement("div");
            col.className = "week-day-col";
            if (dayInfo.isToday) {
              col.classList.add("is-today");
              todayColEl = col;
            }

            const head = document.createElement("div");
            head.className = "week-day-head";

            const dayName = document.createElement("span");
            dayName.className = "week-day-name";
            dayName.textContent = dayInfo.isToday ? `${dayInfo.weekday} · 오늘` : dayInfo.weekday;

            const dayNum = document.createElement("span");
            dayNum.className = "week-day-num";
            dayNum.textContent = `${dayInfo.month}/${dayInfo.day}`;

            head.append(dayName, dayNum);
            col.appendChild(head);

            const dayTasks = sorted.filter((task) => {
              if (task.dueDate !== dayInfo.iso) return false;
              if (courseFilter !== "all" && task.course.trim() !== courseFilter) return false;
              return true;
            });

            const itemsWrap = document.createElement("div");
            itemsWrap.className = "week-day-items";

            if (dayTasks.length === 0) {
              const emptyMsg = document.createElement("p");
              emptyMsg.className = "week-day-empty";
              emptyMsg.textContent = "마감 없음";
              itemsWrap.appendChild(emptyMsg);
            } else {
              dayTasks.forEach((task) => {
                const palette = getCourseColor(task.course);
                const diff = getDayDiff(task.dueDate);
                const isUrgent = !task.completed && diff <= 3;

                const itemBtn = document.createElement("button");
                itemBtn.type = "button";
                itemBtn.className = "cal-item";
                if (task.completed) itemBtn.classList.add("is-completed");
                else if (isUrgent) itemBtn.classList.add("is-urgent");

                itemBtn.style.setProperty("--course-color", palette.color);
                itemBtn.style.setProperty("--course-bg", palette.bg);
                itemBtn.style.setProperty("--course-border", palette.border);
                itemBtn.setAttribute("aria-label", `${task.course} ${task.title} 수정`);

                const courseEl = document.createElement("span");
                courseEl.className = "cal-item-course";
                courseEl.textContent = task.course;

                const titleEl = document.createElement("span");
                titleEl.className = "cal-item-title";
                titleEl.textContent = task.title;

                itemBtn.append(courseEl, titleEl);

                if (isUrgent) {
                  const flag = document.createElement("span");
                  flag.className = "cal-item-flag";
                  flag.textContent = diff < 0 ? `D+${Math.abs(diff)}` : diff === 0 ? "D-Day" : `D-${diff}`;
                  itemBtn.appendChild(flag);
                }

                itemBtn.addEventListener("click", () => startEdit(task));
                itemsWrap.appendChild(itemBtn);
              });
            }

            col.appendChild(itemsWrap);
            weeklyGrid.appendChild(col);
          });

          if (todayColEl && isMobileViewport() && weekOffset === 0) {
            requestAnimationFrame(() => {
              todayColEl.scrollIntoView({ inline: "center", block: "nearest" });

          }

        function renderStats() {
          let activeCount = 0;
          let urgentCount = 0;
          let doneCount = 0;
          let weekCount = 0;

          tasks.forEach((task) => {
            if (isInCurrentWeek(task.dueDate)) {
              weekCount += 1;
            }
            if (task.completed) {
              doneCount += 1;
            } else {
              activeCount += 1;
              if (getDayDiff(task.dueDate) <= 3) {
                urgentCount += 1;
              }
            }
          });

          statActive.textContent = String(activeCount);
          statUrgent.textContent = String(urgentCount);
          statUrgent.classList.toggle("is-urgent", urgentCount > 0);
          statDone.textContent = String(doneCount);

          // Update filter tab counts ("이번주", "전체", "완료")
          const counts = {
            week: weekCount,
            all: tasks.length,
            completed: doneCount,
          };

          const labels = {
            week: "이번주",
            all: "전체",
            completed: "완료",
          };

          statusTabs.forEach((tab) => {
            const key = tab.dataset.statusFilter;
            tab.textContent = `${labels[key]} ${counts[key]}`;
            tab.setAttribute("aria-selected", String(statusFilter === key));
          });

          navLinks.forEach((link) => {
            link.classList.toggle("is-active", link.dataset.navFilter === statusFilter);
          });
        }

        // Syllabus Import Modal & File Handling
        function formatFileSize(bytes) {
          if (bytes < 1024) return `${bytes}B`;
          if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)}KB`;
          return `${(bytes / (1024 * 1024)).toFixed(1)}MB`;
        }

        function arrayBufferToBase64(buffer) {
          const bytes = new Uint8Array(buffer);
          const chunkSize = 0x8000;
          let binary = "";
          for (let i = 0; i < bytes.length; i += chunkSize) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
          }
          return btoa(binary);
        }

        function decodeCsvBuffer(buffer) {
          try {
            return new TextDecoder("utf-8", { fatal: true }).decode(buffer).replace(/^\uFEFF/, "");
          } catch {
            try {
              return new TextDecoder("euc-kr").decode(buffer);
            } catch {
              return new TextDecoder("utf-8").decode(buffer);
            }
          }
        }

        function clearAttachedFile() {
          selectedSyllabusFile = null;
          syllabusFileInput.value = "";
          attachedFileBar.hidden = true;
          attachedFileName.textContent = "";
          attachedFileSize.textContent = "";
        }

        async function handleSyllabusFile(file) {
          if (!file) return;
          const lowerName = file.name.toLowerCase();
          const isPdf = file.type === "application/pdf" || lowerName.endsWith(".pdf");
          const isCsv =
            file.type === "text/csv" ||
            file.type === "application/vnd.ms-excel" ||
            lowerName.endsWith(".csv");

          if (!isPdf && !isCsv) {
            syllabusStatus.classList.add("is-error");
            syllabusStatus.textContent = "PDF(.pdf) 또는 CSV(.csv) 파일만 첨부할 수 있습니다.";
            return;
          }

          if (file.size > 10 * 1024 * 1024) {
            syllabusStatus.classList.add("is-error");
            syllabusStatus.textContent = "파일 크기는 10MB 이하만 지원합니다.";
            return;
          }

          try {
            const buffer = await file.arrayBuffer();
            if (isPdf) {
              selectedSyllabusFile = {
                mimeType: "application/pdf",
                name: file.name,
                size: file.size,
                data: arrayBufferToBase64(buffer),
              };
              attachedFileType.textContent = "PDF";
            } else {
              const csvText = decodeCsvBuffer(buffer).trim();
              if (!csvText) {
                syllabusStatus.classList.add("is-error");
                syllabusStatus.textContent = "비어 있는 CSV 파일입니다.";
                return;
              }
              selectedSyllabusFile = {
                mimeType: "text/csv",
                name: file.name,
                size: file.size,
                textContent: csvText,
              };
              attachedFileType.textContent = "CSV";
            }

            attachedFileName.textContent = file.name;
            attachedFileSize.textContent = formatFileSize(file.size);
            attachedFileBar.hidden = false;
            syllabusStatus.classList.remove("is-error");
            syllabusStatus.textContent = `'${file.name}' 파일이 준비되었습니다. '분석하기'를 눌러 주세요.`;
          } catch {
            syllabusStatus.classList.add("is-error");
            syllabusStatus.textContent = "파일을 읽는 중 오류가 발생했습니다.";
          }
        }

        async function analyzeSyllabusText() {
          if (isAnalyzingSyllabus) return;
          const text = syllabusTextarea.value.trim();
          if (!text && !selectedSyllabusFile) {
            syllabusStatus.textContent = "강의계획서 문장을 붙여넣거나 PDF/CSV 파일을 첨부해 주세요.";
            syllabusStatus.classList.add("is-error");
            syllabusTextarea.focus();
            return;
          }

          isAnalyzingSyllabus = true;
          analyzeSyllabusBtn.disabled = true;
          analyzeSyllabusBtn.textContent = "분석 중...";
          syllabusStatus.classList.remove("is-error");
          syllabusStatus.textContent = selectedSyllabusFile
            ? `'${selectedSyllabusFile.name}' 파일에서 과제 일정을 추출하고 있습니다...`
            : "Gemini가 강의계획서에서 과제 일정을 추출하고 있습니다...";
          extractedPreview = [];
          renderPreviewList();

          try {
            const now = new Date();
            const payload = {
              text,
              currentYear: now.getFullYear(),
              todayISO: formatDateISO(now),
            };
            if (selectedSyllabusFile) {
              payload.file = selectedSyllabusFile;
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 48000);
            let res;
            try {
              res = await fetch("/api/syllabus/parse", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                signal: controller.signal,
              });
            } finally {
              clearTimeout(timeoutId);
            }

            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              throw new Error(data.error || "분석 요청에 실패했습니다.");
            }

            const items = Array.isArray(data.items) ? data.items : [];
            if (items.length === 0) {
              syllabusStatus.classList.add("is-error");
              syllabusStatus.textContent =
                "과제나 마감일 정보를 찾지 못했습니다. 다른 문장이나 파일을 시도해 주세요.";
              return;
            }

            extractedPreview = items.map((item) => ({
              course: String(item.course || "미지정 과목").trim(),
              title: String(item.title || "").trim(),
              dueDate: String(item.dueDate || ""),
              priority: item.priority === "high" || item.priority === "low" ? item.priority : "medium",
            }));

            syllabusStatus.textContent = `${extractedPreview.length}개의 과제를 찾았습니다. 내용을 확인한 뒤 '모두 추가'를 눌러 등록하세요.`;
            renderPreviewList();
          } catch (err) {
            syllabusStatus.classList.add("is-error");
            if (err && err.name === "AbortError") {
              syllabusStatus.textContent = "서버 응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.";
            } else {
              syllabusStatus.textContent =
                err instanceof Error ? err.message : "분석 중 오류가 발생했습니다.";
            }
          } finally {
            isAnalyzingSyllabus = false;
            analyzeSyllabusBtn.disabled = false;
            analyzeSyllabusBtn.textContent = "분석하기";
          }
        }

        function confirmImportAll() {
          const validItems = extractedPreview.filter(
            (item) => item.course.trim() && item.title.trim() && /^\d{4}-\d{2}-\d{2}$/.test(item.dueDate)
          );
          if (validItems.length === 0) {
            syllabusStatus.classList.add("is-error");
            syllabusStatus.textContent = "추가할 수 있는 유효한 과제(과목명·과제명·마감일)가 없습니다.";
            return;
          }

          const baseTime = Date.now();
          const addedIds = [];
          validItems.forEach((item, idx) => {
            const id = createId();
            addedIds.push(id);
            tasks.push({
              id,
              course: item.course.trim(),
              title: item.title.trim(),
              dueDate: item.dueDate,
              priority: item.priority || "medium",
              completed: false,
              createdAt: baseTime + idx,
            });
          });

          statusFilter = "all";
          courseFilter = "all";
          extractedPreview = [];
          syllabusTextarea.value = "";
          clearAttachedFile();
          renderPreviewList();
          closeSyllabusModal();
          saveTasks();
          render();

          showToast(`${validItems.length}개의 과제를 추가했습니다.`, () => {
            const idSet = new Set(addedIds);
            tasks = tasks.filter((t) => !idSet.has(t.id));
            saveTasks();
            render();
          });
        }

        // Event Bindings
        openComposerBtn.addEventListener("click", () => {
          resetForm();
          openSheet();
        });

        closeSheetBtn.addEventListener("click", closeSheet);
        composerBackdrop.addEventListener("click", closeSheet);

        openSyllabusBtn.addEventListener("click", openSyllabusModal);
        openSyllabusFromFormBtn.addEventListener("click", openSyllabusModal);
        closeSyllabusBtn.addEventListener("click", closeSyllabusModal);
        cancelSyllabusBtn.addEventListener("click", closeSyllabusModal);
        syllabusBackdrop.addEventListener("click", (e) => {
          if (e.target === syllabusBackdrop) closeSyllabusModal();
        });
        pickSyllabusFileBtn.addEventListener("click", () => syllabusFileInput.click());
        syllabusFileInput.addEventListener("change", (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) handleSyllabusFile(file);
          syllabusFileInput.value = "";
        });
        removeFileBtn.addEventListener("click", () => {
          clearAttachedFile();
          syllabusStatus.classList.remove("is-error");
          syllabusStatus.textContent = "";
        });
        syllabusDropzone.addEventListener("dragover", (e) => {
          e.preventDefault();
          syllabusDropzone.classList.add("is-dragover");
        });
        syllabusDropzone.addEventListener("dragleave", () => {
          syllabusDropzone.classList.remove("is-dragover");
        });
        syllabusDropzone.addEventListener("drop", (e) => {
          e.preventDefault();
          syllabusDropzone.classList.remove("is-dragover");
          const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (file) handleSyllabusFile(file);
        });
        sampleSyllabusBtn.addEventListener("click", () => {
          const d1 = getOffsetDateISO(2);
          const d2 = getOffsetDateISO(5);
          const [, m1, day1] = d1.split("-").map(Number);
          const [, m2, day2] = d2.split("-").map(Number);
          syllabusTextarea.value = `[데이터베이스] ${m1}/${day1} ER 다이어그램 설계 레포트 제출, ${m2}월 ${day2}일 SQL 튜닝 프로젝트 발표\n[컴퓨터네트워크] ${m2}.${day2} TCP 소켓 프로그래밍 과제 마감`;
          syllabusStatus.textContent = "";
          syllabusStatus.classList.remove("is-error");
        });
        analyzeSyllabusBtn.addEventListener("click", analyzeSyllabusText);
        confirmImportBtn.addEventListener("click", confirmImportAll);

        cancelDeleteBtn.addEventListener("click", closeDeleteDialog);
        confirmDeleteBtn.addEventListener("click", confirmDeleteTask);
        deleteDialogBackdrop.addEventListener("click", (e) => {
          if (e.target === deleteDialogBackdrop) closeDeleteDialog();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (deleteDialogBackdrop.classList.contains("is-open")) {
              closeDeleteDialog();
            } else if (syllabusBackdrop.classList.contains("is-open")) {
              closeSyllabusModal();
            } else if (composerPanel.classList.contains("is-open")) {
              closeSheet();
            }
          }
        });

        prevWeekBtn.addEventListener("click", () => {
          weekOffset -= 1;
          renderWeeklyCalendar();
        });

        currentWeekBtn.addEventListener("click", () => {
          weekOffset = 0;
          renderWeeklyCalendar();
        });

        nextWeekBtn.addEventListener("click", () => {
          weekOffset += 1;
          renderWeeklyCalendar();
        });

        priorityBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            setPriority(btn.dataset.priority);
          });
        });

        dateQuickBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            const offset = Number(btn.dataset.dateOffset || 0);
            dueDateInput.value = getOffsetDateISO(offset);
            formError.textContent = "";
          });
        });

        statusTabs.forEach((tab) => {
          tab.addEventListener("click", () => {
            statusFilter = tab.dataset.statusFilter;
            render();
          });
        });

        navLinks.forEach((link) => {
          link.addEventListener("click", () => {
            statusFilter = link.dataset.navFilter;
            render();
          });
        });

        cancelEditBtn.addEventListener("click", () => {
          resetForm();
          if (isMobileViewport()) closeSheet();
        });

        resetSampleBtn.addEventListener("click", resetToStarterTasks);

        toastUndoBtn.addEventListener("click", () => {
          if (!undoAction) return;
          const fn = undoAction;
          undoAction = null;
          toast.classList.remove("is-visible");
          fn();
        });

        taskForm.addEventListener("submit", (e) => {
          e.preventDefault();

          const course = courseInput.value.trim();
          const title = titleInput.value.trim();
          const dueDate = dueDateInput.value;

          if (!course) {
            formError.textContent = "과목명을 입력해 주세요.";
            courseInput.focus();
            return;
          }
          if (!title) {
            formError.textContent = "과제명을 입력해 주세요.";
            titleInput.focus();
            return;
          }
          if (!dueDate) {
            formError.textContent = "마감일을 선택해 주세요.";
            dueDateInput.focus();
            return;
          }

          formError.textContent = "";

          if (editingId) {
            const target = tasks.find((t) => t.id === editingId);
            if (target) {
              target.course = course;
              target.title = title;
              target.dueDate = dueDate;
              target.priority = selectedPriority;
            }
          } else {
            tasks.push({
              id: createId(),
              course,
              title,
              dueDate,
              priority: selectedPriority,
              completed: false,
              createdAt: Date.now(),
            });
          }

          if (!editingId) {
            if (statusFilter === "completed" || (statusFilter === "week" && !isInCurrentWeek(dueDate))) {
              statusFilter = "all";
            }
          }

          saveTasks();
          resetForm();
          render();

          if (isMobileViewport()) {
            closeSheet();
          } else {
            titleInput.focus();
          }
        });

        // Init
        dueDateInput.value = getOffsetDateISO(1);
        loadTasks();
        render();
      })();
    </script>
  </body>
</html>
